<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <title>IPAOK Documentation Hub</title>
  <meta name="description" content="Guides and resources for IPA Oklahoma volunteers and staff">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛪</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Docsify Vue Theme (base) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #2563eb;
    }

    /* ── Typography ── */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: #111827 !important;
      border-right: none !important;
    }

    .sidebar-toggle {
      background: #111827 !important;
    }

    .sidebar-toggle span {
      background-color: #4b5563 !important;
    }

    /* App name / site title */
    .app-name-link span {
      color: #f9fafb !important;
      font-size: 1.05em !important;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Search input */
    .search {
      border-bottom: 1px solid #1f2937 !important;
      padding: 8px 16px 12px !important;
    }

    .search input {
      background: #1f2937 !important;
      border: 1px solid #374151 !important;
      color: #f3f4f6 !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.85em !important;
    }

    .search input::placeholder {
      color: #6b7280 !important;
    }

    .search .results-panel {
      background: #1f2937 !important;
    }

    .search .results-panel .matching-post {
      border-bottom: 1px solid #374151 !important;
    }

    .search .results-panel .matching-post a {
      color: #f3f4f6 !important;
    }

    .search .results-panel .matching-post p {
      color: #9ca3af !important;
    }

    /* Nav links */
    .sidebar-nav {
      padding: 8px 0 40px !important;
    }

    .sidebar-nav a {
      color: #9ca3af !important;
      font-size: 0.875em;
      font-weight: 450;
      padding: 5px 20px !important;
      display: block;
      transition: color 0.15s, background 0.15s;
      line-height: 1.5;
    }

    .sidebar-nav a:hover {
      color: #f3f4f6 !important;
      background: rgba(255, 255, 255, 0.04) !important;
      text-decoration: none !important;
    }

    /* Active link */
    .sidebar-nav li.active > a {
      color: #ffffff !important;
      font-weight: 500;
      background: rgba(37, 99, 235, 0.18) !important;
      border-right: 3px solid #2563eb !important;
    }

    /* Section labels — bold non-linked items */
    .sidebar-nav > ul > li > strong {
      display: block;
      color: #4b5563 !important;
      font-size: 0.7em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 18px 20px 5px !important;
      pointer-events: none;
    }

    /* Nested sub-items (e.g. ProPresenter sub-pages) */
    .sidebar-nav ul li ul {
      padding-left: 8px !important;
    }

    .sidebar-nav ul li ul li a {
      font-size: 0.83em !important;
      padding-left: 28px !important;
      color: #6b7280 !important;
    }

    .sidebar-nav ul li ul li.active > a {
      color: #e5e7eb !important;
    }

    /* Scrollbar */
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }

    /* ── Content Area ── */
    .markdown-section {
      max-width: 860px;
      padding: 40px 52px 80px;
      font-size: 15.5px;
      line-height: 1.75;
      color: #1f2937;
    }

    .markdown-section h1 {
      font-size: 2em;
      font-weight: 750;
      color: #111827;
      letter-spacing: -0.025em;
      line-height: 1.25;
      margin: 0 0 0.75em;
      padding-bottom: 0.5em;
      border-bottom: 2px solid #f3f4f6;
    }

    .markdown-section h2 {
      font-size: 1.35em;
      font-weight: 650;
      color: #111827;
      margin: 2.5em 0 0.75em;
      letter-spacing: -0.015em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid #f3f4f6;
    }

    .markdown-section h3 {
      font-size: 1.1em;
      font-weight: 600;
      color: #1f2937;
      margin: 1.75em 0 0.5em;
    }

    .markdown-section h4 {
      font-size: 0.9em;
      font-weight: 600;
      color: #374151;
      margin: 1.5em 0 0.5em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .markdown-section a {
      color: #2563eb;
      font-weight: 500;
      text-decoration: none;
    }

    .markdown-section a:hover {
      text-decoration: underline;
      color: #1d4ed8;
    }

    /* Callout-style blockquotes */
    .markdown-section blockquote {
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      border-radius: 0 8px 8px 0;
      padding: 14px 20px;
      margin: 1.5em 0;
      color: #374151;
    }

    .markdown-section blockquote p {
      margin: 0;
    }

    /* Images with subtle shadow */
    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.06);
      max-width: 100%;
      margin: 0.5em 0;
    }

    /* Inline code */
    .markdown-section code {
      background: #f3f4f6;
      color: #dc2626;
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 0.875em;
    }

    /* Code blocks */
    .markdown-section pre {
      background: #111827 !important;
      border-radius: 10px !important;
      padding: 20px 24px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .markdown-section pre code {
      background: transparent !important;
      color: #d1d5db !important;
      font-size: 0.875em;
    }

    /* Tables */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      font-size: 0.9em;
    }

    .markdown-section thead th {
      background: #f9fafb;
      font-weight: 600;
      color: #111827;
      padding: 10px 16px;
      border-bottom: 2px solid #e5e7eb;
      text-align: left;
    }

    .markdown-section tbody td {
      padding: 10px 16px;
      border-bottom: 1px solid #f3f4f6;
      color: #374151;
    }

    .markdown-section tbody tr:hover td {
      background: #f9fafb;
    }

    .markdown-section hr {
      border: none;
      border-top: 2px solid #f3f4f6;
      margin: 2.5em 0;
    }

    .markdown-section ul li,
    .markdown-section ol li {
      margin: 0.35em 0;
    }

    /* ── Cover Page ── */
    section.cover {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 55%, #0c2340 100%) !important;
    }

    section.cover .cover-main h1 {
      font-family: 'Inter', sans-serif;
      font-size: 3.2em;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    section.cover .cover-main blockquote {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.15em;
      line-height: 1.7;
      padding: 0;
      margin: 0.5em 0 2em;
    }

    section.cover .cover-main blockquote p {
      color: rgba(255, 255, 255, 0.6);
    }

    section.cover .cover-main > p:last-child {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    section.cover .cover-main > p:last-child a {
      padding: 11px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95em;
      text-decoration: none;
      transition: all 0.2s;
    }

    section.cover .cover-main > p:last-child a:first-child {
      background: #2563eb;
      color: #fff;
      border: 2px solid #2563eb;
    }

    section.cover .cover-main > p:last-child a:first-child:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
    }

    section.cover .cover-main > p:last-child a:not(:first-child) {
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    section.cover .cover-main > p:last-child a:not(:first-child):hover {
      border-color: rgba(255, 255, 255, 0.45);
      color: #fff;
    }

    section.cover a.anchor span {
      border-color: rgba(255, 255, 255, 0.35) !important;
    }

    /* ── Pagination ── */
    .pagination-item a {
      color: #2563eb !important;
      font-weight: 500;
    }

    .pagination-item--next .pagination-item-label,
    .pagination-item--previous .pagination-item-label {
      color: #6b7280 !important;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'IPAOK Docs',
      themeColor: '#2563eb',

      // Cover page
      coverpage: true,
      onlyCover: false,

      // Sidebar
      auto2top: true,
      loadSidebar: true,
      maxLevel: 0,
      subMaxLevel: 2,

      // Search
      search: {
        placeholder: 'Search docs...',
        noData: 'No matches found.',
        depth: 2,
      },

      // Prev / Next navigation
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      }
    };
  </script>

  <!-- Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>
